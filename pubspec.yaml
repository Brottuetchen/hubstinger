name: family_hub
description: Family Hub - Self-hosted media & homelab dashboard
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # Networking
  http: ^1.2.0

  # Images
  cached_network_image: ^3.3.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Animations
  flutter_animate: ^4.5.0

  # UI
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.4
  app_links: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
