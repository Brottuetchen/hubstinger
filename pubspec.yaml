name: family_hub
description: Family Hub - Self-hosted media & homelab dashboard
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.0

  # Networking
  http: ^1.2.0
  dio: ^5.4.0

  # Images
  cached_network_image: ^3.3.1

  # Storage
  shared_preferences: ^2.2.2

  # Animations
  flutter_animate: ^4.5.0

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Push Notifications
  firebase_messaging: ^14.7.0
  firebase_core: ^2.27.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.4
  package_info_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#02030c"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
